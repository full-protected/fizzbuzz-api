services:
  php:
    build:
      context: ./docker/php
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-dev}
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-fizzbuzz}
      - POSTGRES_USER=${POSTGRES_USER:-fizzbuzz}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fizzbuzz}
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fizzbuzz}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  database_data:
